; Blockle Hero — iOS export preset.
;
; There was no export preset at all before this, which is why no .ipa could be
; produced: nothing defined a bundle id, a team, or what to include.
;
; EXCLUSIONS MATTER HERE. tools/ is ~46 MB of headless harnesses and QA PNGs
; that no player ever runs, and the dev scenes below are debug harnesses. The
; shipped payload is the 139 imported heroes plus the game, nothing else.
;
; scenes/Main.tscn MUST NEVER BE LISTED in exclude_filter. It is
; project.godot's run/main_scene — the scene the app boots into — and Godot
; honours the filter without warning that the boot scene has just been dropped,
; so the only symptom is a black screen on the device after the splash. It was
; excluded here once, which is why this comment exists.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, branding/*, docs/*, scenes/MoveDbg.tscn, scenes/PlayTest.tscn, scenes/Shots.tscn, scenes/StunGait.tscn, scenes/StunLive.tscn, scenes/StunShot.tscn, scenes/ThreadTest.tscn"
export_path="build/ios/BlockleHero.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
architecture/universal=true
plugins/godot_openxr_vendors=false
application/app_store_team_id="B87ALX4XW9"
application/code_sign_identity_debug=""
application/export_method_debug=1
application/code_sign_identity_release=""
application/export_method_release=0
application/bundle_identifier="org.blockle.hero"
application/signature=""
application/short_version="1.0.0"
application/version="1"
application/icon_interpolation=4
application/launch_screens_interpolation=4
; Stop after generating the Xcode project + PCK instead of archiving here.
;
; Godot writes CODE_SIGN_IDENTITY="Apple Distribution" while the generated
; project uses automatic signing, which xcodebuild rejects outright
; ("conflicting provisioning settings"). Signing and archiving belong on CI,
; which has the App Store Connect key; locally this proves the Godot half.
; Flip to false on a machine with the distribution identity installed.
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
application/generate_simulator_library_if_missing=true
; 15.0, not 13.0. Godot's mobile renderer requires Vulkan, so the export stamps
; UIRequiredDeviceCapabilities = iphone-ipad-minimum-performance-a12 into the
; bundle — and A12 implies iOS 14+, so App Store Connect rejected the upload
; outright with ITMS-90098 ("incompatible with the MinimumOSVersion value of
; 13.0"). The linker was already hinting at it: libgodot.a objects are built for
; iOS 14.0 and were being linked at 13.0.
;
; 15.0 rather than the minimum 14.0 because Apple requires a 15.0+ deployment
; target for uploads from April 2027 (ITMS-90068), and nothing in this game runs
; on hardware that old anyway.
application/min_ios_version="15.0"
capabilities/access_wifi=false
capabilities/push_notifications=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/camera_usage_description_localized={}
privacy/microphone_usage_description=""
privacy/microphone_usage_description_localized={}
privacy/photolibrary_usage_description=""
privacy/photolibrary_usage_description_localized={}
privacy/tracking_enabled=false
privacy/tracking_domains=PackedStringArray()
privacy/collected_data/name/collected=false
icons/iphone_120x120=""
icons/iphone_180x180=""
icons/ipad_76x76=""
icons/ipad_152x152=""
icons/ipad_167x167=""
icons/app_store_1024x1024=""
icons/spotlight_40x40=""
icons/spotlight_80x80=""
icons/settings_58x58=""
icons/settings_87x87=""
icons/notification_40x40=""
icons/notification_60x60=""
storyboard/use_launch_screen_storyboard=true
storyboard/image_scale_mode=0
storyboard/custom_image@2x=""
storyboard/custom_image@3x=""
storyboard/use_custom_bg_color=false
storyboard/custom_bg_color=Color(0, 0, 0, 1)
